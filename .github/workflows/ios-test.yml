# Runs the unit suite inside an iOS simulator: exports the Xcode project,
# builds it for the simulator with signing off, boots an iPhone, and drives
# the app's self-test mode (tools/ios_selftest.sh). macOS minutes cost ten
# times Linux ones, so this runs only by hand.
name: ios-test
on:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.1-stable

jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/hexmap/godot
            ~/Library/Application Support/Godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-templates-macos
      - run: ./run.sh install
      - name: Install export templates
        run: |
          set -e
          dest="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION/-stable/.stable}"
          if [ ! -f "$dest/ios.zip" ]; then
            curl -fL --retry 3 -o /tmp/templates.tpz \
              "https://github.com/godotengine/godot/releases/download/$GODOT_VERSION/Godot_v${GODOT_VERSION}_export_templates.tpz"
            mkdir -p "$dest"
            unzip -q /tmp/templates.tpz -d /tmp/templates
            mv /tmp/templates/templates/* "$dest/"
            rm -rf /tmp/templates /tmp/templates.tpz
          fi
          ls "$dest" | grep -i ios
      - name: Stamp the build
        run: |
          printf '{"commit": "%s", "built": "%s", "run": %s, "ref": "%s"}\n' "$GITHUB_SHA" "$(date -u +'%Y-%m-%d %H:%M UTC')" "$GITHUB_RUN_NUMBER" "$GITHUB_REF_NAME" > build_info.json
          cat build_info.json
      - run: ./run.sh check
      - name: Export the Xcode project
        run: |
          set -e
          godot="$(./run.sh doctor | awk '/^godot/ {print $2}')"
          mkdir -p out/ios
          "$godot" --headless --path . --export-debug iOS out/ios/Hexmap.xcodeproj 2>&1 | tee out/ios_export.log
          ! grep -q "^ERROR" out/ios_export.log
          ls out/ios
      - name: What Xcode and what project
        run: |
          xcodebuild -version
          ls /Applications | grep -i xcode || true
          head -n 12 out/ios/Hexmap.xcodeproj/project.pbxproj
          grep -n "objectVersion\|compatibilityVersion" out/ios/Hexmap.xcodeproj/project.pbxproj | head
          ls out/ios/Hexmap.xcodeproj
          xcodebuild -list -project out/ios/Hexmap.xcodeproj 2>&1 | head -n 20 || true
          plutil -lint out/ios/Hexmap.xcodeproj/project.pbxproj || true
          grep -n '\$' out/ios/Hexmap.xcodeproj/project.pbxproj | head -n 20 || true
      - name: Fill the plugin placeholders the export leaves behind
        # A project-only export keeps $additional_pbx_* / $pbx_embeded_frameworks
        # (the hooks for iOS plugins, of which we have none) as literal lines,
        # which Xcode cannot parse. Each is alone on a list line: drop them.
        run: |
          set -e
          f=out/ios/Hexmap.xcodeproj/project.pbxproj
          sed -i '' -E '/^[[:space:]]*\$(pbx_embeded_frameworks|additional_pbx_[a-z_]+)[[:space:]]*$/d' "$f"
          ! grep -nE '^[[:space:]]*\$[a-z_]+[[:space:]]*$' "$f"
          plutil -lint "$f"
          plist="$(find out/ios -name '*Info.plist' -not -path '*/build/*' | head -n 1)"
          echo "plist: $plist"
          plutil -lint "$plist"
          grep -n '\$[a-z_]' "$plist" || true
      - name: Build for the simulator
        run: |
          set -e
          cd out/ios
          # Godot's simulator library is x86_64 only; an Apple-silicon simulator
          # runs an x86_64 app under Rosetta, so build for that.
          xcodebuild -project Hexmap.xcodeproj -target Hexmap -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            ARCHS=x86_64 ONLY_ACTIVE_ARCH=NO SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" \
            build 2>&1 | tee ../xcodebuild.log | grep -E "error:|warning: .*(sign|team)|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" ../xcodebuild.log
          ls build/Debug-iphonesimulator/
      - name: Self-test on the simulator
        run: tools/ios_selftest.sh out/ios/build/Debug-iphonesimulator/Hexmap.app out/ios-selftest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-selftest
          path: |
            out/ios-selftest/
            out/ios_export.log
            out/xcodebuild.log
            out/ios/Hexmap.xcodeproj/project.pbxproj
