# The suite, headless on Linux: on pull requests, on pushes to main and to
# tags, and by hand (`gh workflow run ci.yml --ref dev`). Pushes to dev
# do not run it by themselves: a step is checked when asked, not on every
# commit (Actions minutes on a private repo are finite).
name: ci
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.7.1-stable
    steps:
      - uses: actions/checkout@v4
      - name: Cache Godot
        uses: actions/cache@v4
        with:
          path: ~/.cache/hexmap/godot
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64
      - name: Install Godot
        run: ./run.sh install
      - name: Script check
        run: ./run.sh check
      - name: Unit tests
        run: ./run.sh test
      - name: Examples regenerate cleanly
        run: |
          ./run.sh examples
          git diff --exit-code -- examples/
      - name: Pack contact sheet renders headless
        run: ./run.sh sheet woodland out/woodland.png 64
  # The web clients (web/): types, unit tests, and the zip the host serves
  # built from these sources (a stale webclient.zip fails here).
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Types and Svelte
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: The committed webclient.zip is this build
        run: |
          npm run build
          git diff --exit-code -- ../webclient.zip || { echo "webclient.zip is stale: run 'npm run build' in web/ and commit it"; exit 1; }
