# Builds Hexmap for Android (APK), Linux, Windows and macOS and publishes
# them as a GitHub release:
#   - push a tag vX.Y.Z      -> assets on that release
#   - run it by hand         -> a "dev-build" prerelease, replaced each time
# The APK is a debug-signed build for sideloading onto a phone on the
# same network as a Table.
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.1-stable

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Godot and export templates
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/hexmap/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-templates-linux-x86_64
      - name: Install Godot
        run: ./run.sh install
      - name: Install export templates
        run: |
          set -e
          dest="$HOME/.local/share/godot/export_templates/${GODOT_VERSION/-stable/.stable}"
          if [ ! -f "$dest/android_debug.apk" ]; then
            curl -fL --retry 3 -o /tmp/templates.tpz \
              "https://github.com/godotengine/godot/releases/download/$GODOT_VERSION/Godot_v${GODOT_VERSION}_export_templates.tpz"
            mkdir -p "$dest"
            unzip -q /tmp/templates.tpz -d /tmp/templates
            mv /tmp/templates/templates/* "$dest/"
          fi
          ls "$dest" | head
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK pieces Godot needs
        run: |
          set -e
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "build-tools;35.0.0" "platforms;android-35" "cmdline-tools;latest" >/dev/null
      - name: Debug keystore
        run: |
          # One persistent debug key (tools/keys/), so every build updates the last.
          cp tools/keys/debug.keystore "$HOME/debug.keystore"
      - name: Point Godot at the SDK
        run: |
          set -e
          godot="$(./run.sh doctor | awk '/^godot/ {print $2}')"
          # Let the editor write its settings file once, then add the paths.
          "$godot" --headless --editor --quit --path . >/dev/null 2>&1 || true
          f="$(ls "$HOME/.config/godot/"editor_settings-*.tres | head -n 1)"
          echo "settings: $f"
          cat >> "$f" <<SETTINGS
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          SETTINGS
          tail -n 6 "$f"
      - name: Version from the tag
        run: |
          v="${GITHUB_REF_NAME#v}"
          case "$GITHUB_REF" in refs/tags/v*) ;; *) v="$(grep -o 'config/version="[^"]*"' project.godot | cut -d'"' -f2)-dev.${GITHUB_RUN_NUMBER}" ;; esac
          sed -i "s/^version\/name=.*/version\/name=\"$v\"/; s/^version\/code=.*/version\/code=${GITHUB_RUN_NUMBER}/" export_presets.cfg
          grep -E '^version/' export_presets.cfg
      - name: Import the project
        run: ./run.sh check
      - name: Check what the pack will contain
        run: |
          set -e
          godot="$(./run.sh doctor | awk '/^godot/ {print $2}')"
          mkdir -p out
          "$godot" --headless --path . --export-pack Linux out/Hexmap.pck 2>&1 | tee out/pack.log
          ! grep -q "^ERROR" out/pack.log
          (cd out && "$godot" --headless -s ../tools/check_export.gd -- Hexmap.pck)
      - name: Export the APK
        run: |
          set -e
          godot="$(./run.sh doctor | awk '/^godot/ {print $2}')"
          "$godot" --headless --path . --export-debug Android out/Hexmap.apk 2>&1 | tee out/apk.log
          ! grep -q "^ERROR" out/apk.log
          ls -la out/Hexmap.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Hexmap-android
          path: out/Hexmap.apk

  desktop:
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      matrix:
        include:
          - preset: Linux
            out: out/linux/Hexmap.x86_64
            zip: Hexmap-linux.zip
          - preset: Windows Desktop
            out: out/windows/Hexmap.exe
            zip: Hexmap-windows.zip
          - preset: macOS
            out: out/macos/Hexmap.zip
            zip: Hexmap-macos.zip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/hexmap/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-templates-linux-x86_64
      - run: ./run.sh install
      - name: Install export templates
        run: |
          set -e
          dest="$HOME/.local/share/godot/export_templates/${GODOT_VERSION/-stable/.stable}"
          if [ ! -f "$dest/linux_debug.x86_64" ]; then
            curl -fL --retry 3 -o /tmp/templates.tpz \
              "https://github.com/godotengine/godot/releases/download/$GODOT_VERSION/Godot_v${GODOT_VERSION}_export_templates.tpz"
            mkdir -p "$dest"
            unzip -q /tmp/templates.tpz -d /tmp/templates
            mv /tmp/templates/templates/* "$dest/"
          fi
      - run: ./run.sh check
      - name: Export
        run: |
          set -e
          godot="$(./run.sh doctor | awk '/^godot/ {print $2}')"
          mkdir -p "$(dirname '${{ matrix.out }}')"
          "$godot" --headless --path . --export-release "${{ matrix.preset }}" "${{ matrix.out }}" 2>&1 | tee out/export.log
          ! grep -q "^ERROR" out/export.log
          # The placeholder packs travel beside the executable (next to the .app on macOS).
          if [ "${{ matrix.preset }}" = "macOS" ]; then
            mkdir -p out/macos/bundle && (cd out/macos/bundle && unzip -q ../Hexmap.zip)
            cp -R packs out/macos/bundle/packs
            (cd out/macos/bundle && zip -qr "../../${{ matrix.zip }}" .)
          else
            cp -R packs "$(dirname '${{ matrix.out }}')/packs"
            (cd "$(dirname '${{ matrix.out }}')" && zip -qr "../${{ matrix.zip }}" .)
          fi
          ls -la out/
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.zip }}
          path: out/${{ matrix.zip }}

  publish:
    needs: [android, desktop]
    if: always() && needs.android.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          ls -la dist
          case "$GITHUB_REF" in
            refs/tags/v*)
              tag="$GITHUB_REF_NAME"
              gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "Hexmap $tag" --notes "See CHANGELOG.md."
              gh release upload "$tag" dist/* --clobber
              ;;
            *)
              gh release delete dev-build --cleanup-tag -y 2>/dev/null || true
              gh release create dev-build --prerelease --target "$GITHUB_SHA" \
                --title "Dev build ${GITHUB_SHA::7}" \
                --notes "Automated build of \`dev\` at ${GITHUB_SHA}. The APK is debug-signed: enable installing from unknown sources, install, open Player, and it will list Tables hosting on your wifi (or type the address the Table shows)." \
                dist/*
              ;;
          esac
