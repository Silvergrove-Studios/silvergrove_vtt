# Build the Luau GDExtension (the plugin runtime) from source against the
# godot-cpp that matches our Godot, for every desktop platform, and offer
# the binaries as artifacts to commit under addons/luau_gdextension/bin.
# The upstream release binaries are built against godot-cpp 4.5 and crash
# in 4.7 release templates (docs/lua-runtime.md). The patch under
# addons/luau_gdextension/build adapts the source to godot-cpp 10 and
# pins the API version.
name: build-luau
on:
  workflow_dispatch:
    inputs:
      ref:
        description: luau-gdextension tag or commit
        default: "0.6.1"

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-14
            preset: macos-arm64-release
            out: libgdluau.darwin.arm64.dylib
          - os: ubuntu-22.04
            preset: linux-x86_64-release
            out: libgdluau.linux.x86_64.so
          - os: windows-2022
            preset: windows-x86_64-release
            out: gdluau.windows.amd64.dll
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: fernforestgames/luau-gdextension
          ref: ${{ inputs.ref }}
          path: src
      - uses: actions/checkout@v4
        with:
          path: hexmap
          sparse-checkout: addons/luau_gdextension/build
      - name: Adapt to godot-cpp 10 / our Godot API
        shell: bash
        run: |
          cd src
          git apply ../hexmap/addons/luau_gdextension/build/godot-cpp-10.patch
          grep -n "GIT_TAG\|GODOTCPP_API_VERSION" CMakeLists.txt
      - name: Ninja
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get update && sudo apt-get install -y ninja-build; else brew install ninja; fi
      - name: Configure and build
        shell: bash
        run: |
          cd src
          cmake --preset ${{ matrix.preset }} -DBUILD_TESTING=OFF
          cmake --build build --target gdluau -j
      - name: Collect
        shell: bash
        run: |
          mkdir -p out
          f=$(find src -name "${{ matrix.out }}" -not -path "*/_deps/*" | head -1)
          echo "built: $f"
          cp "$f" out/
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: luau-${{ matrix.preset }}
          path: out/*
